// PROPOSAL to the Lexicon session — NOT landed, NOT generated from.
//
// Ariadne publishes these three messages today (DESIGN §5). The payloads it emits are
// hand-encoded to this shape's canonical protobuf JSON, so adopting the contract swaps
// the encoder without changing a byte on the wire.
//
// WHY THIS IS A PROPOSAL AND NOT A PR TO the-lexicon: contracts ripple across every
// service, and the working agreement is propose, don't land. Ariadne is one producer
// with two prospective consumers; the shape below is what it actually emits, offered as
// the starting point rather than the answer.
//
// NAME COLLISION, flagged 2026-09-07 — please read before filing this anywhere:
// `codex/messages/v1/catalog.proto` already exists in the Lexicon and says it is
// "RESERVED for the future Ariadne extraction". It is NOT this service. Its shapes are
// PostCreated / TagsChanged / PostPurged — Artemis's media catalog, with an analytics
// consumer someone planned to call Ariadne. This Ariadne is the Product Catalog
// (products, prices, purchases), seeded 2026-08-26 per codex/docs/product-catalog.md.
// Two different things are currently called Ariadne in the Lexicon's namespace, and one
// of them owns a file named `catalog`. Worth renaming one before either ships.

syntax = "proto3";

package codex.catalog.v1;

// ---------------------------------------------------------------- shared

// Money is a decimal STRING, never a float or a double. A price is exact; 4.99 has no
// binary representation, and a consumer comparing prices for a deal would be comparing
// rounding artefacts.
message Money {
  string amount = 1;    // decimal, e.g. "4.99"
  string currency = 2;  // ISO 4217, e.g. "CAD"
}

message Quantity {
  string amount = 1;  // decimal
  string unit = 2;    // stable enum NAME (e.g. "Gram"), not a display label
}

// WHICH STORES A PRICE SPEAKS FOR (DESIGN §2.3.1). This is the field consumers most need
// and would most easily get wrong if it were flattened.
//
// A flyer feed cannot name an individual franchise — merchant plus queried postal code is
// the finest grain it offers — so a scraped price is an AREA fact. Recording it as one
// store's price under-counts coverage; expanding it to N member stores fabricates N facts.
// Deal alerting is wrong in both directions without this.
// A THIRD VARIANT IS RESERVED, on the HermesMQ session's advice (2026-11-13), and the reason is
// the timing rather than a known third kind: if consumers match this union exhaustively, adding a
// variant later is a BREAKING change, and right now is the only window in which no consumer
// exists. A plausible third is a national/banner-wide price (one price across every region), which
// is neither exact nor area — but it is not needed today and inventing its fields now would be
// guessing. Reserving the field number costs nothing and keeps the option.
//
// Consumers SHOULD treat an unrecognised variant as "a scope I cannot interpret" and skip the
// fact, not fall back to exact or area — either fallback is one of the two silent errors this
// union exists to prevent.
message PriceScope {
  oneof kind {
    ExactScope exact = 1;   // observed AT a store (a receipt, a store-specific price)
    AreaScope area = 2;     // a chain's flyer for a region
    // 3 reserved — see above.
  }
  reserved 3;
}
message ExactScope { string store_id = 1; }
message AreaScope {
  string chain_id = 1;
  string area = 2;  // flyer-coverage region (an FSA for Flipp sources)
}

message PriceSource {
  oneof kind {
    ScrapeSource scrape = 1;
    PurchaseSource purchase = 2;
    ManualSource manual = 3;
    BackfillSource backfill = 4;
  }
}
// `raw_response_id` is REQUIRED on a scrape: a scraped fact that cannot name the bytes it
// was read out of cannot be re-derived when the decoder turns out to have been wrong.
message ScrapeSource { string scraper = 1; string raw_response_id = 2; }
message PurchaseSource { string purchase_id = 1; }
message ManualSource {}
message BackfillSource { string origin = 1; }

// Values are prefixed with the enum name because protobuf enum values are scoped to the PACKAGE,
// not to the enum — bare ACTIVE/MANUAL/SCRAPE would be package-level identifiers, and the
// collision they invite is the kind that shows up as a build error in someone else's module. This
// is also what `buf lint` at STANDARD requires (ENUM_VALUE_PREFIX).
//
// NOTE, because it is not free: canonical protobuf JSON serializes enums BY NAME, and Lexicon's
// HermesMQ wire format IS canonical JSON. So these names are on the wire — "PRODUCT_STATUS_ACTIVE",
// not "ACTIVE". Binary protobuf is unaffected. Done now because no consumer exists yet; after one
// does, it is a coordinated migration across a live topic.
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_PROVISIONAL = 1;   // auto-created from a scraped listing; prices flow immediately
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_MERGED_INTO = 3;   // this id forwards; see merged_into
  PRODUCT_STATUS_DEPRECATED = 4;
}

enum ProductOrigin {
  PRODUCT_ORIGIN_UNSPECIFIED = 0;
  PRODUCT_ORIGIN_MANUAL = 1;
  PRODUCT_ORIGIN_SCRAPE = 2;
  PRODUCT_ORIGIN_MIGRATION = 3;
}

// ---------------------------------------------- topic: product.registered

// Registrations ONLY. Merges moved to their own topic (below) — DESIGN §10.1, decided
// 2026-11-13 on the Lexicon session's lean. The overload made a registrations-only consumer
// decode every merge and discard it, forever, to save one topic: Dionysus wants
// registrations and not merges, Demeter wants merges so it can re-point a watch. Those are
// different subscriptions.
message ProductRegistered {
  string product_id = 1;
  string name = 2;
  string brand = 3;
  string category = 4;      // coarse MARKET category — never food-role, which is Dionysus's
  Quantity size = 5;
  string gtin = 6;
  ProductStatus status = 7;
  ProductOrigin origin = 8;
  // Field 9 was `merged_into`, set when status = MERGED_INTO, back when this message carried
  // merges too. Reserved rather than reused: a consumer built against the older shape reads
  // field 9 as a merge target, and handing it an unrelated string would be worse than
  // handing it nothing.
  reserved 9;
}

// -------------------------------------------------- topic: product.merged

// A product id that now forwards. The loser's id keeps resolving forever — Dionysus and
// Demeter hold ids Ariadne does not control — so this is hygiene for a consumer that caches
// or watches an id, not a deletion it must race to honour.
//
// Deliberately NOT the full product shape. A merge says one thing, and a consumer that needs
// the winner's attributes can GetProduct it; repeating them here would invite a consumer to
// treat a merge notice as a registration of the winner, which it is not.
message ProductMerged {
  string product_id = 1;    // the loser — the id a consumer may be holding
  string merged_into = 2;   // the canonical id to re-point to
  ProductStatus status = 3; // always PRODUCT_STATUS_MERGED_INTO; stated so the product's
                            // actual state and the topic cannot be read as disagreeing
}

// ----------------------------------------- topic: product.price.observed

// Demeter's required feed: "whenever PriceObserved on a watched product, then evaluate".
message PriceObserved {
  string product_id = 1;
  PriceScope scope = 2;
  Money price = 3;
  UnitPrice unit_price = 4;
  Promo promo = 5;

  // BOTH confidences ride the message, and size_confidence is not optional decoration
  // (DESIGN §2.3). Demeter's match confidence is the weakest link of its own split
  // confidence and this one; omit it and downstream judgment silently reads too high.
  double price_confidence = 6;
  double size_confidence = 7;

  string observed_at = 8;  // RFC 3339
  PriceSource source = 9;
}
message UnitPrice { string amount = 1; string currency = 2; string per = 3; }
// A flyer's own CLAIM about a promotion — a fact. Whether it is a good deal is Demeter's
// judgment, and that line is the whole reason these are two services.
message Promo { string description = 1; string percent_off = 2; }

// ------------------------------------------- topic: purchase.recorded

message PurchaseRecorded {
  string purchase_id = 1;
  string store_id = 2;
  string purchased_at = 3;  // RFC 3339
  repeated PurchaseLine lines = 4;
  Money total = 5;
  PurchaseSourceKind source = 6;
}
message PurchaseLine {
  string product_id = 1;
  string quantity = 2;  // decimal string
  Money price_paid = 3;
  Money line_total = 4;
}
// PURCHASE_SOURCE_KIND_, not PURCHASE_SOURCE_ — the prefix is the full enum name, which is why
// even the UNSPECIFIED value had to move. The old PURCHASE_MANUAL was a hand-rolled dodge of the
// package-scope collision with ProductOrigin.MANUAL; the prefix rule removes the need to dodge.
enum PurchaseSourceKind {
  PURCHASE_SOURCE_KIND_UNSPECIFIED = 0;
  PURCHASE_SOURCE_KIND_MANUAL = 1;
  PURCHASE_SOURCE_KIND_RECEIPT = 2;
  PURCHASE_SOURCE_KIND_BANK_IMPORT = 3;
}
