# Insomnia collection for ariadne-service (DESIGN §4 — kept live as the API evolves).
#
# Import: Insomnia > Preferences > Data > Import Data > From File.
# Set the `base` environment variable to wherever the service is reachable.
#
# Every REST endpoint the service exposes appears here. If you add a route and do not add
# it here, the collection stops being the thing you can hand someone to try the API.
type: collection.insomnia.rest/5.0
name: ariadne
meta:
  id: wrk_ariadne
  created: 1756500000000
  modified: 1756500000000
collection:
  - name: catalog
    meta: { id: fld_catalog, sortKey: -1 }
    children:
      - name: Get product
        meta: { id: req_get_product, sortKey: -10 }
        method: GET
        url: "{{ _.base }}/api/v1/products/{{ _.productId }}"
        headers:
          - { name: Accept, value: application/json }
      - name: Search products
        meta: { id: req_search_products, sortKey: -9 }
        method: GET
        url: "{{ _.base }}/api/v1/products/search"
        parameters:
          - { name: q, value: butter }
          - { name: limit, value: "20" }
        headers:
          - { name: Accept, value: application/json }
      - name: Current price at a store
        meta: { id: req_current_price, sortKey: -8 }
        method: GET
        url: "{{ _.base }}/api/v1/products/{{ _.productId }}/price"
        parameters:
          - { name: storeId, value: "{{ _.storeId }}" }
        headers:
          - { name: Accept, value: application/json }
        description: >-
          Resolves exact-over-area. The `scope` field says whether the number came from a
          store-specific observation or the chain's flyer for that region.
      - name: Resolve a product
        meta: { id: req_resolve_product, sortKey: -7 }
        method: POST
        url: "{{ _.base }}/api/v1/products/resolve"
        body:
          mimeType: application/json
          text: |-
            {
              "name": "Lactantia salted butter 454g",
              "brand": "Lactantia"
            }
        headers:
          - { name: Content-Type, value: application/json }
          - { name: X-Correlation-Id, value: "{{ _.correlationId }}" }
        description: >-
          Path B of the resolver (interactive). All three outcomes are 200 — a `no_match` is an
          answer, not an error. This path never auto-creates a product; on `ambiguous` a review
          case is opened and `caseId` is what you confirm against.
  - name: stores
    meta: { id: fld_stores, sortKey: -2.5 }
    children:
      - name: List stores
        meta: { id: req_list_stores, sortKey: -10 }
        method: GET
        url: "{{ _.base }}/api/v1/stores"
        parameters:
          - { name: chainId, value: "", disabled: true }
          - { name: area, value: "", disabled: true }
          - { name: includeInactive, value: "false" }
          - { name: limit, value: "100" }
        headers:
          - { name: Accept, value: application/json }
      - name: Get store
        meta: { id: req_get_store, sortKey: -9 }
        method: GET
        url: "{{ _.base }}/api/v1/stores/{{ _.storeId }}"
        headers:
          - { name: Accept, value: application/json }
      - name: Resolve store text
        meta: { id: req_resolve_store, sortKey: -8 }
        method: GET
        url: "{{ _.base }}/api/v1/stores/resolve"
        parameters:
          - { name: q, value: Metro }
          - { name: area, value: "", disabled: true }
        headers:
          - { name: Accept, value: application/json }
        description: >-
          Turns a receipt's typed store text into candidate franchises. It never picks: "Metro"
          names a chain, and every franchise of that chain is equally consistent with it. Check
          `unique` rather than the length of `matches`.
      - name: Register a store
        meta: { id: req_register_store, sortKey: -7 }
        method: POST
        url: "{{ _.base }}/api/v1/stores"
        body:
          mimeType: application/json
          text: |-
            {
              "name": "IGA Beaubien",
              "chainId": "iga",
              "area": "H2X",
              "label": "Beaubien & Papineau"
            }
        headers:
          - { name: Content-Type, value: application/json }
          - { name: X-Correlation-Id, value: "{{ _.correlationId }}" }
        description: >-
          Omit `id` and a stable one is derived from chain+area+name, so a retry lands on the
          store it already created instead of registering a second franchise.
  - name: review queue
    meta: { id: fld_review, sortKey: -2 }
    children:
      - name: List pending cases
        meta: { id: req_list_cases, sortKey: -10 }
        method: GET
        url: "{{ _.base }}/api/v1/resolutions"
        parameters:
          - { name: limit, value: "50" }
        headers:
          - { name: Accept, value: application/json }
      - name: Confirm
        meta: { id: req_confirm, sortKey: -9 }
        method: POST
        url: "{{ _.base }}/api/v1/resolutions/{{ _.caseId }}/confirm"
        body:
          mimeType: application/json
          text: |-
            { "productId": "{{ _.productId }}" }
        headers:
          - { name: Content-Type, value: application/json }
          - { name: X-Correlation-Id, value: "{{ _.correlationId }}" }
        description: >-
          productId must be one of the candidates the matcher offered; anything else is a 409.
          Use Reject to create a different product instead.
      - name: Reject (create a new product)
        meta: { id: req_reject, sortKey: -8 }
        method: POST
        url: "{{ _.base }}/api/v1/resolutions/{{ _.caseId }}/reject"
        body:
          mimeType: application/json
          text: |-
            { "productId": "new-product-id" }
        headers:
          - { name: Content-Type, value: application/json }
      - name: Merge
        meta: { id: req_merge, sortKey: -7 }
        method: POST
        url: "{{ _.base }}/api/v1/resolutions/{{ _.caseId }}/merge"
        body:
          mimeType: application/json
          text: |-
            { "winner": "canonical-product-id", "loser": "duplicate-product-id" }
        headers:
          - { name: Content-Type, value: application/json }
        description: >-
          The loser becomes a forwarding tombstone. Its id keeps resolving forever, because
          Dionysus and Demeter hold ids Ariadne does not control.
      - name: Split
        meta: { id: req_split, sortKey: -6 }
        method: POST
        url: "{{ _.base }}/api/v1/resolutions/{{ _.caseId }}/split"
        body:
          mimeType: application/json
          text: |-
            {
              "listingStoreId": "{{ _.storeId }}",
              "listingExternalId": "ext-9",
              "productId": "new-product-id"
            }
        headers:
          - { name: Content-Type, value: application/json }
  - name: purchases
    meta: { id: fld_purchases, sortKey: -2.4 }
    children:
      - name: Record a purchase
        meta: { id: req_record_purchase, sortKey: -10 }
        method: POST
        url: "{{ _.base }}/api/v1/purchases"
        body:
          mimeType: application/json
          text: |-
            {
              "id": "{{ _.purchaseId }}",
              "storeId": "{{ _.storeId }}",
              "purchasedAt": "2026-11-10T14:30:00Z",
              "lines": [
                { "productId": "{{ _.productId }}", "quantity": "1", "pricePaid": "4.99", "lineTotal": "4.99" }
              ],
              "total": "4.99",
              "source": "manual"
            }
        headers:
          - { name: Content-Type, value: application/json }
          - { name: X-Correlation-Id, value: "{{ _.correlationId }}" }
        description: >-
          Send this one TWICE. The second call is 202, not 409 — an identical re-record is a no-op
          success, which is what lets a client's write-ahead outbox drain (§7.1). Change the total
          and send it again under the same id and it becomes 409: that is an id collision, not a
          retry. Money is a decimal string throughout; each line also becomes a price fact at
          exact{storeId} with source=purchase (§2.4).
      - name: Void a purchase
        meta: { id: req_void_purchase, sortKey: -9 }
        method: POST
        url: "{{ _.base }}/api/v1/purchases/{{ _.purchaseId }}/void"
        body:
          mimeType: application/json
          text: |-
            { "reason": "wrong store" }
        headers:
          - { name: Content-Type, value: application/json }
        description: >-
          Corrections are new facts, not edits — both events persist. This does NOT retract the
          price facts the purchase produced: the price paid was still paid.
  - name: ops
    meta: { id: fld_ops, sortKey: -3 }
    children:
      - name: Health
        meta: { id: req_health, sortKey: -10 }
        method: GET
        url: "{{ _.base }}/health"
      - name: OpenAPI document
        meta: { id: req_openapi, sortKey: -9 }
        method: GET
        url: "{{ _.base }}/docs/openapi.yaml"
environments:
  name: Base Environment
  meta: { id: env_base }
  data:
    base: http://localhost:8080
    productId: p-1
    storeId: s-1
    caseId: r-1
    purchaseId: pur-1
    correlationId: insomnia-local
