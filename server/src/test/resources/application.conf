# Test overrides of the runtime config.
#
# The runtime runs `provider = cluster` because ShardedDaemonProcess needs a cluster to
# supervise the projection instances. No TEST needs one — the projection tests drive
# projections directly through ProjectionTestKit — and leaving it on makes every suite
# form a cluster and contend for the same remoting port. Local provider here keeps the
# suites independent and fast.
include "serialization"
include "persistence"

pekko.actor.provider = "local"

# Ignored under the local provider, but keeps a stray remoting start from colliding.
pekko.remote.artery.canonical.port = 0
