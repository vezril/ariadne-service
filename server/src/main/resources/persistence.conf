# Journal + projection storage (DESIGN §2, §3). Postgres via the shared pg-service
# chart in the cluster; every value is env-overridable so the image stays
# environment-agnostic.

pekko.persistence {
  journal.plugin = "pekko.persistence.r2dbc.journal"
  snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
  state.plugin = "pekko.persistence.r2dbc.durable-state"

  r2dbc {
    dialect = "postgres"
    connection-factory {
      driver = "postgres"
      host = "localhost"
      host = ${?DB_HOST}
      port = 5432
      port = ${?DB_PORT}
      database = "ariadne"
      database = ${?DB_NAME}
      user = "ariadne"
      user = ${?DB_USER}
      password = "ariadne"
      password = ${?DB_PASSWORD}
    }
  }
}

# The projections use the same connection factory as the journal.
pekko.projection.r2dbc {
  dialect = "postgres"
  use-connection-factory = "pekko.persistence.r2dbc.connection-factory"
}

# Single-node cluster: ShardedDaemonProcess needs a cluster to run the projection
# instances under, and this service is deployed with replicaCount 1.
pekko {
  actor.provider = "cluster"
  remote.artery.canonical {
    hostname = "127.0.0.1"
    hostname = ${?CLUSTER_HOST}
    port = 25520
    port = ${?CLUSTER_PORT}
  }
  cluster {
    seed-nodes = ["pekko://ariadne@127.0.0.1:25520"]
    seed-nodes = [${?CLUSTER_SEED}]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}
