include "serialization"
include "persistence"

# ariadne runtime configuration. Every operational value is overridable by an
# environment variable via a Typesafe Config ${?ENV_VAR} substitution. No secrets
# are committed here.

ariadne {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }
}
