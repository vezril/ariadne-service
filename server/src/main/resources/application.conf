include "serialization"
include "persistence"

# ariadne runtime configuration. Every operational value is overridable by an
# environment variable via a Typesafe Config ${?ENV_VAR} substitution. No secrets
# are committed here.

ariadne {
  db {
    # Every statement in the bundled DDL is CREATE ... IF NOT EXISTS, so applying it on
    # each boot is a no-op once current. Off is for environments that manage schema out
    # of band.
    auto-migrate = true
    auto-migrate = ${?DB_AUTO_MIGRATE}
  }

  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  # The scraping policy (DESIGN 2.3/2.6). OFF by default, and that default is a
  # decision rather than caution: enabling it points a scraper at a live, undocumented,
  # bot-walled third-party endpoint. That should be an explicit operator act in the
  # environment that means to do it, never something a service starts doing because it
  # was deployed.
  scrape {
    enabled = false
    enabled = ${?SCRAPE_ENABLED}

    # How often each source runs. Flyer windows are measured in days; hourly polling
    # would buy nothing and cost politeness budget.
    interval = 6h
    interval = ${?SCRAPE_INTERVAL}

    # Delay before the first run after boot, so a restart does not immediately fetch.
    initial-delay = 2m
    initial-delay = ${?SCRAPE_INITIAL_DELAY}

    # No default source list. Quirk #5: one postal code decides which stores' flyers
    # exist, and there is no useful default for "where Calvin shops" -- a guessed
    # postal code would scrape a real, wrong city and look entirely successful.
    sources = []
  }
}

# Shape of a source entry, for reference (kept out of `sources` so the empty default
# stays empty):
#
# ariadne.scrape.sources = [
#   {
#     name = "flipp"
#     base-url = "https://flipp.example/api"
#     postal-code = "H2X1Y4"
#     locale = "en-ca"          # or fr-ca
#     # Which Flipp merchant id is which chain. A merchant with no mapping is SKIPPED,
#     # never guessed: inventing a chain attributes real prices to the wrong banner.
#     chains = { "1234" = "metro", "5678" = "iga" }
#   }
# ]
