# Event serialization (DESIGN §2: CborSerializable ADTs). The domain marker trait
# is bound to the CBOR serializer; `core` stays Pekko-free, so the binding lives
# here rather than on the trait.
pekko.actor {
  serialization-bindings {
    "me.cference.ariadne.domain.CborSerializable" = jackson-cbor
  }
}

pekko.serialization.jackson {
  jackson-modules += "me.cference.ariadne.persistence.AriadneJacksonModule"
}
